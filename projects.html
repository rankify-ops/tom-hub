<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Tom Hub</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#ececec;--muted:#a3a3a3;--faint:#777;--red:#f87171;--amber:#fbbf24;--green:#34d399;--blue:#60a5fa;--purple:#c084fc;--grey:#9ca3af;--glass:rgba(255,255,255,.07);--border:rgba(255,255,255,.12);--border-s:rgba(255,255,255,.07);--font:'Inter',-apple-system,sans-serif;
--rankify:#2dd4a8;--personal:#60a5fa;--itm:#f59e0b;--hiatus:#e879f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;background:url('/wallpaper.jpg') center/cover fixed no-repeat #0a0a0a;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:rgba(8,8,12,.88);z-index:0;pointer-events:none}
body>*{position:relative;z-index:1}
header{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:rgba(12,12,20,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:.75rem;color:var(--muted)}.crumb a{color:var(--rankify);text-decoration:none}
h1{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:-.01em;margin-right:auto}
.meta{font-size:.75rem;color:var(--muted)}
.btn{font-family:var(--font);font-size:.8rem;font-weight:600;color:var(--text);background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{font-family:var(--font);font-size:.8rem;font-weight:600;padding:8px 14px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
.filters{margin-top:12px}
.f{font-family:var(--font);font-size:1rem;font-weight:700;padding:10px 18px;border-radius:12px;border:2px solid var(--border);background:var(--glass);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.f .n{font-size:.75rem;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px}
.f.on{color:#0b0b0b;border-color:transparent}
.f[data-a=All].on{background:#fff}
.f[data-a=Rankify].on{background:var(--rankify)}.f[data-a=Personal].on{background:var(--personal)}.f[data-a=ITM].on{background:var(--itm)}.f[data-a=Hiatus].on{background:var(--hiatus)}
.f.on .n{background:rgba(0,0,0,.18)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;cursor:pointer;padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--glass);user-select:none}
.tog.on{border-color:var(--red);color:var(--red)}
.counts{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-left:auto}
.counts b{font-size:1.05rem}
main{flex:1;min-height:0;padding:14px 16px 16px}
.board{display:grid;gap:12px;height:100%}
.board.all{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.035);border:1px solid var(--border-s);border-radius:16px}
.colh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-s)}
.colh h2{font-size:1.05rem;font-weight:800;color:#fff}
.colh .c{font-size:.75rem;color:var(--muted);margin-left:auto;text-align:right}
.cards{overflow-y:auto;padding:10px;display:grid;gap:8px;align-content:start;flex:1;min-height:0}
.board.single .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:rgba(20,20,28,.75);border:1px solid var(--border);border-left:5px solid var(--grey);border-radius:12px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:rgba(255,255,255,.25)}
.card.late{border-left-color:var(--red)}.card.blocked{border-left-color:var(--purple)}.card.at_risk{border-left-color:var(--amber)}.card.on_track{border-left-color:var(--green)}.card.open{border-left-color:var(--grey)}
.ct{display:flex;align-items:flex-start;gap:8px}
.ct h3{font-size:.95rem;font-weight:700;color:#fff;line-height:1.25;flex:1}
.st{flex:0 0 auto;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.st.late{background:rgba(248,113,113,.18);color:var(--red)}.st.blocked{background:rgba(192,132,252,.18);color:var(--purple)}.st.at_risk{background:rgba(251,191,36,.18);color:var(--amber)}.st.on_track{background:rgba(52,211,153,.16);color:var(--green)}.st.open{background:rgba(156,163,175,.16);color:var(--grey)}
.where{font-size:.75rem;color:var(--muted);margin-top:4px}
.track{display:flex;gap:3px;margin-top:7px}
.track i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.track i.d{background:rgba(255,255,255,.55)}
.track i.h{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.next{font-size:.82rem;line-height:1.35;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next b{font-size:.66rem;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--muted)}
.chip.red{color:var(--red);background:rgba(248,113,113,.12)}.chip.amber{color:var(--amber);background:rgba(251,191,36,.12)}.chip.purple{color:var(--purple);background:rgba(192,132,252,.12)}
.more{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-s);font-size:.76rem;color:var(--muted);line-height:1.45}
.card.x .more{display:block}.card.x .next{-webkit-line-clamp:unset}
.more ul{padding-left:16px;color:var(--text)}
.more .k{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.lane-msg{border:2px dashed var(--border);border-radius:12px;padding:12px;font-size:.82rem;color:var(--muted);line-height:1.45}
.lane-msg b{color:#fff;display:block;margin-bottom:4px}
.note{font-size:.72rem;color:var(--faint);padding:0 4px}
.empty{font-size:.85rem;color:var(--faint);padding:10px}
.tl{height:100%;overflow:auto;background:rgba(255,255,255,.035);border:1px solid var(--border-s);border-radius:16px;padding:14px}
.tl-grid{display:grid;grid-template-columns:150px 110px 1fr;min-width:900px}
.tl-h{font-size:.72rem;color:var(--muted);padding-bottom:8px;position:relative;height:26px}
.tl-h span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-name{font-weight:800;font-size:1rem;padding:14px 0;border-top:1px solid var(--border-s)}
.tl-over{border-top:1px solid var(--border-s);padding:10px 8px 10px 0;font-size:.72rem;color:var(--red)}
.tl-over div{margin-bottom:3px;line-height:1.3}
.tl-lane{position:relative;border-top:1px solid var(--border-s);min-height:64px}
.tl-wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--border-s)}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px dashed #fff;z-index:2}
.ms{position:absolute;transform:translateX(-6px);display:flex;align-items:center;gap:5px;font-size:.7rem;white-space:nowrap;color:var(--text)}
.ms i{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
@media(max-width:1100px){body{overflow:auto}.board.all{grid-template-columns:repeat(2,minmax(0,1fr));height:auto}.cards{max-height:70vh}}
@media(max-width:640px){.board.all{grid-template-columns:1fr}.f{font-size:.9rem;padding:8px 12px}h1{font-size:1.2rem}.counts{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="row">
    <div style="margin-right:auto">
      <div class="crumb"><a href="/">Tom Hub</a> / Projects</div>
      <h1>All projects</h1>
    </div>
    <span class="meta" id="updated">Loading…</span>
    <div class="seg" id="view"><button data-v="board" class="on">Board</button><button data-v="timeline">Timeline</button></div>
    <button class="btn" id="refresh" title="Pull fresh from every hub">↻ Refresh</button>
  </div>
  <div class="row filters">
    <div class="row" id="filters"></div>
    <span class="tog" id="blocked" role="switch" aria-checked="false">⚠ Late &amp; blocked only</span>
    <div class="counts" id="counts"></div>
  </div>
</header>
<main id="main"></main>
<script>
const AREAS=[{k:'Rankify',label:'Rankify',src:'Rankify CRM'},{k:'Personal',label:'Personal',src:'Tom Hub'},{k:'ITM',label:'ITM',src:'ITM Command Centre'},{k:'Hiatus',label:'Hiatus Collection',src:'Hiatus Hub'}];
const COLORS={Rankify:'var(--rankify)',Personal:'var(--personal)',ITM:'var(--itm)',Hiatus:'var(--hiatus)'};
const ST={late:'Overdue',blocked:'Blocked',at_risk:'Due soon',on_track:'On track',open:'No date',done:'Done'};
const S={area:localStorage.getItem('lp_area')||'All',blocked:false,view:'board',data:null};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>{const x=new Date(d+'T00:00:00Z');return x.getUTCDate()+' '+MON[x.getUTCMonth()]};
const dd=(d,t)=>Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(t+'T00:00:00Z'))/864e5);

function lane(a){return S.data?S.data.lanes.find(l=>l.area===a):null}
function visible(cards){return S.blocked?cards.filter(c=>c.status==='late'||c.status==='blocked'):cards}

function dueChip(c){
  if(!c.due)return'';const n=dd(c.due,S.data.today);
  if(n<0)return`<span class="chip red">Overdue ${-n}d · ${fmt(c.due)}</span>`;
  if(n===0)return`<span class="chip amber">Due today</span>`;
  if(n<=3)return`<span class="chip amber">Due ${fmt(c.due)} · ${n}d</span>`;
  return`<span class="chip">Due ${fmt(c.due)}</span>`;
}
function track(c){
  if(c.stages&&c.stages.length&&c.stageIndex>=0)return'<div class="track" title="'+esc(c.stages.map((s,i)=>i===c.stageIndex?'▶ '+s+' (you are here)':s).join(' → '))+'">'+c.stages.map((s,i)=>`<i class="${i<c.stageIndex?'d':i===c.stageIndex?'h':''}"></i>`).join('')+'</div>';
  if(typeof c.progress==='number'){const n=10,h=Math.min(n-1,Math.floor(c.progress*n));return'<div class="track" title="'+Math.round(c.progress*100)+'% of items done">'+Array.from({length:n},(_,i)=>`<i class="${i<h?'d':i===h?'h':''}"></i>`).join('')+'</div>'}
  return'';
}
function cardHTML(c){
  const stagesTxt=c.stages&&c.stages.length&&c.stageIndex>=0?c.stages.map((s,i)=>i===c.stageIndex?'<b style="color:#fff">'+esc(s)+' ← you are here</b>':esc(s)).join(' → '):'';
  return`<div class="card ${c.status}" onclick="this.classList.toggle('x')">
  <div class="ct"><h3>${esc(c.name)}</h3><span class="st ${c.status}">${ST[c.status]||esc(c.status)}</span></div>
  ${c.where?`<div class="where">📍 ${esc(c.where)}</div>`:''}
  ${track(c)}
  ${c.next?`<div class="next"><b>NEXT</b>${esc(c.next)}</div>`:''}
  <div class="chips">${dueChip(c)}${c.blocker?`<span class="chip purple">⛔ ${esc(c.blocker)}</span>`:''}${c.openCount?`<span class="chip">${c.openCount} open</span>`:''}</div>
  <div class="more">
    ${stagesTxt?`<div class="k">Stages</div><div>${stagesTxt}</div>`:''}
    ${c.implementNext&&c.implementNext.length?`<div class="k">Implement next</div><ul>${c.implementNext.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="k">Owner · source</div><div>${esc(c.owner)} · ${esc(c.source)}${c.kind?' · '+esc(c.kind):''}</div>
  </div></div>`;
}
function laneMsg(l){
  if(!l)return'<div class="empty">Loading…</div>';
  if(l.state==='live')return l.note?`<div class="note">${esc(l.note)}</div>`:'';
  const title={needs_key:'🔑 Needs a read-only key',needs_endpoint:'🧩 Needs a projects endpoint',error:'⚠ Hub not reachable'}[l.state]||'⚠ Not loaded';
  return`<div class="lane-msg"><b>${title}</b>${esc(l.note)}<br>Nothing to do tonight. This lane fills in by itself once it's sorted.</div>`;
}
function renderFilters(){
  const all=S.data?S.data.lanes.reduce((n,l)=>n+l.cards.length,0):'';
  let h=`<button class="f ${S.area==='All'?'on':''}" data-a="All">All <span class="n">${all}</span></button>`;
  for(const a of AREAS){const l=lane(a.k);const n=l?(l.state==='live'?l.cards.length:'—'):'';h+=`<button class="f ${S.area===a.k?'on':''}" data-a="${a.k}"><span class="dot" style="background:${COLORS[a.k]}"></span>${a.label} <span class="n">${n}</span></button>`}
  document.getElementById('filters').innerHTML=h;
  document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{S.area=b.dataset.a;localStorage.setItem('lp_area',S.area);render()});
  const b=document.getElementById('blocked');b.classList.toggle('on',S.blocked);b.setAttribute('aria-checked',S.blocked);
  if(S.data){const cs=S.data.lanes.filter(l=>S.area==='All'||l.area===S.area).flatMap(l=>l.cards);const c=k=>cs.filter(x=>x.status===k).length;
    document.getElementById('counts').innerHTML=`<span><b style="color:var(--red)">${c('late')}</b> overdue</span><span><b style="color:var(--purple)">${c('blocked')}</b> blocked</span><span><b style="color:var(--amber)">${c('at_risk')}</b> due soon</span><span><b style="color:var(--green)">${c('on_track')}</b> on track</span>`}
}
function renderBoard(){
  const areas=AREAS.filter(a=>S.area==='All'||S.area===a.k);
  let h=`<div class="board ${S.area==='All'?'all':'single'}">`;
  for(const a of areas){const l=lane(a.k);const cards=l?visible(l.cards):[];
    const when=l&&l.state==='live'?'Live · '+esc(a.src):esc(a.src);
    h+=`<section class="col"><div class="colh"><span class="dot" style="background:${COLORS[a.k]};width:12px;height:12px"></span><h2>${a.label}</h2><span class="c">${when}</span></div><div class="cards">${laneMsg(l)}${cards.map(cardHTML).join('')}${l&&l.state==='live'&&!cards.length?`<div class="empty">${S.blocked?'Nothing overdue or blocked 🎉':'No open projects'}</div>`:''}</div></section>`}
  return h+'</div>';
}
function renderTimeline(){
  const t=S.data.today,start=new Date(t+'T00:00:00Z');start.setUTCDate(start.getUTCDate()-((start.getUTCDay()+6)%7));
  const s0=start.toISOString().slice(0,10),span=56,pct=d=>Math.max(0,Math.min(100,dd(d,s0)/span*100));
  let h='<div class="tl"><div class="tl-grid"><div></div><div class="tl-h" style="color:var(--red)">Overdue</div><div class="tl-h">';
  for(let w=0;w<=8;w++){const d=new Date(start);d.setUTCDate(d.getUTCDate()+w*7);h+=`<span style="left:${w/8*100}%">${fmt(d.toISOString().slice(0,10))}</span>`}
  h+='</div>';
  for(const a of AREAS.filter(a=>S.area==='All'||S.area===a.k)){const l=lane(a.k);const cards=l?visible(l.cards):[];
    const ms=[];for(const c of cards){const list=(c.milestones&&c.milestones.length)?c.milestones:(c.due?[{date:c.due,label:c.name}]:[]);for(const m of list)ms.push({...m,status:c.status,card:c.name});if(c.due&&c.due<t)ms.push({date:c.due,label:c.name,status:c.status,card:c.name})}
    const over=[...new Map(ms.filter(m=>m.date<t).sort((x,y)=>x.date<y.date?1:-1).map(m=>[m.card,m])).values()].sort((x,y)=>x.date<y.date?-1:1);
    const grp=new Map();for(const m of ms.filter(m=>m.date>=t&&dd(m.date,s0)<=span)){const k=m.card+'|'+m.date;if(!grp.has(k))grp.set(k,[]);grp.get(k).push(m)}
    const fut=[...grp.values()].map(g=>({...g[0],label:g.length===1?g[0].label:g[0].card+' ('+g.length+')'})).sort((x,y)=>x.date<y.date?-1:1);
    const W=Math.max(600,(document.getElementById('main').clientWidth||1200)-300),rowEnd=[];
    for(const m of fut){m.short=m.label.length>34?m.label.slice(0,33)+'…':m.label;const px=pct(m.date)/100*W,w=(m.short.length+8)*6.2+18,x0=pct(m.date)>78?px-w:px;let r=rowEnd.findIndex(e=>e<x0);if(r<0){r=rowEnd.length;rowEnd.push(-1e9)}rowEnd[r]=x0+w;m.row=r}
    const rows=Math.max(1,rowEnd.length);
    h+=`<div class="tl-name" style="color:${COLORS[a.k]}">${a.label}${l&&l.state!=='live'?'<div style="font-size:.7rem;color:var(--muted);font-weight:500">'+(l.state==='needs_key'?'🔑 needs key':'not loaded')+'</div>':''}</div>`;
    h+=`<div class="tl-over">${over.map(m=>`<div>● ${esc(m.card)} <span style="color:var(--faint)">${fmt(m.date)}</span></div>`).join('')||'<span style="color:var(--faint)">—</span>'}</div>`;
    h+=`<div class="tl-lane" style="height:${Math.max(64,rows*22+16)}px">`;
    for(let w=0;w<=8;w++)h+=`<div class="tl-wk" style="left:${w/8*100}%"></div>`;
    h+=`<div class="tl-today" style="left:${pct(t)}%"></div>`;
    fut.forEach(m=>{const right=pct(m.date)>78;h+=`<div class="ms" style="${right?'right:'+(100-pct(m.date))+'%;flex-direction:row-reverse;transform:translateX(6px)':'left:'+pct(m.date)+'%'};top:${8+m.row*22}px" title="${esc(m.label)} · ${fmt(m.date)}"><i style="background:${COLORS[a.k]}"></i>${esc(m.short)} · ${fmt(m.date)}</div>`});
    h+='</div>'}
  return h+'</div><div class="note" style="margin-top:10px">Next 8 weeks from Monday. Dashed line is today. Items with no date stay on the Board.</div></div>';
}
function render(){
  renderFilters();
  document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  document.getElementById('main').innerHTML=!S.data?'<div class="empty">Pulling live from each hub…</div>':S.view==='board'?renderBoard():renderTimeline();
}
async function load(refresh){
  document.getElementById('updated').textContent='Pulling live…';
  try{
    const r=await fetch('/api/life-projects'+(refresh?'?refresh=1':''),{credentials:'same-origin'});
    if(r.status===401){location.href='/login?next=/projects';return}
    S.data=await r.json();
    const d=new Date(S.data.generatedAt);
    document.getElementById('updated').textContent='Live as of '+d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',timeZone:'Australia/Brisbane'})+' AEST';
  }catch(e){document.getElementById('updated').textContent='Could not load'}
  render();
}
document.getElementById('blocked').onclick=()=>{S.blocked=!S.blocked;render()};
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
document.getElementById('refresh').onclick=()=>load(true);
render();load(false);
</script>
</body>
</html>
